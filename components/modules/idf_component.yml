## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=6.0.0'
  # Component dependencies
  espressif/libsodium: ^1.0.21
  espressif/mdns: ^1.4.2
  espressif/mqtt: ^1.0.0

  # Ethernet driver dependencies
  espressif/dp83848:
    version: ^1.0.0
    rules:
     - if: target in esp32
  espressif/ip101:
    version: ^1.0.0
    rules:
     - if: target in esp32
  espressif/ksz80xx:
    version: ^1.0.0
    rules:
     - if: target in esp32
  espressif/lan87xx:
    version: ^1.0.0
    rules:
     - if: target in esp32
  espressif/rtl8201:
    version: ^1.0.1
    rules:
     - if: target in esp32
